# The previous image started node .output/server/index.mjs without building it.
# A Dockerfile build fails unless that file exists.
[build]
builder = "DOCKERFILE"

[deploy]
startCommand = "node .output/server/index.mjs"
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
